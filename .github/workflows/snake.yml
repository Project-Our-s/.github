name: Generate Dual Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Combined Grid with Dual Custom Colored Snakes
      - name: Generate Combined Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swagatambordoloi,simpi11-insightflow
          outputs: |
            dist/combined-snake-dark.svg?color_snake=#38bdf8,#f472b6&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Deploy SVG to 'output' branch
      - name: Push SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
