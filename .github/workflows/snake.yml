name: Generate Dual Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Swagatam's Grid & Snake
      - name: Generate Swagatam's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swagatambordoloi
          outputs: |
            dist/swagatam-snake.svg?color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Simpi's Grid & Snake
      - name: Generate Simpi's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: simpi11-insightflow
          outputs: |
            dist/simpi-snake.svg?color_snake=#f472b6&color_dots=#161b22,#4a1d24,#831843,#be185d,#f43f5e

      # Deploy SVGs to Output Branch
      - name: Push SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
