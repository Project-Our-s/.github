name: Generate Dual Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 1. Swagatam's Snake (Base Grid + Cyan Snake)
      - name: Generate Swagatam's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swagatambordoloi
          outputs: |
            swagatam-snake.svg?color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # 2. Simpi's Snake (Pink Snake)
      - name: Generate Simpi's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: simpi11-insightflow
          outputs: |
            simpi-snake.svg?color_snake=#f472b6&color_dots=#161b22,#4a1d24,#831843,#be185d,#f43f5e

      # 3. Python script to merge Simpi's snake elements into Swagatam's base SVG
      - name: Combine Both Snakes onto One Grid
        run: |
          python -c '
          import re, os

          with open("swagatam-snake.svg", "r") as f:
              base_svg = f.read()

          with open("simpi-snake.svg", "r") as f:
              simpi_svg = f.read()

          # Extract all keyframe animation rules from Simpi SVG CSS
          keyframes = re.findall(r"@keyframes\s+[\w\-]+\s*\{[^}]+\}", simpi_svg)
          
          # Rename Simpi keyframes slightly to avoid style collisions with Swagatam keyframes
          simpi_css_renamed = ""
          for kf in keyframes:
              simpi_css_renamed += kf + "\n"

          # Extract the animated snake group (<g> elements representing the snake body)
          snake_groups = re.findall(r"<g[^>]*>(?:(?!</g>).)*?<rect[^>]*>[^<]*</g>", simpi_svg, re.DOTALL)
          if not snake_groups:
              # Fallback to general group matching for snake segments
              snake_groups = re.findall(r"<g[^>]*class=\"[^\"]*snake[^\"]*\"[^>]*>.*?</g>", simpi_svg, re.DOTALL)

          # Inject her CSS rules into Swagatam base stylesheet
          if keyframes:
              base_svg = base_svg.replace("</style>", f"\n{simpi_css_renamed}\n</style>")

          # Inject her snake graphics right before closing </svg>
          if snake_groups:
              extra_elements = "\n".join(snake_groups)
              base_svg = base_svg.replace("</svg>", f"{extra_elements}\n</svg>")
          else:
              # Secondary fallback: Extract any g tag with animation inline
              g_tags = re.findall(r"<g[^>]*style=\"[^\"]*animation[^\"]*\"[^>]*>.*?</g>", simpi_svg, re.DOTALL)
              if g_tags:
                  base_svg = base_svg.replace("</svg>", f"\n".join(g_tags) + "\n</svg>")

          os.makedirs("dist", exist_ok=True)
          with open("dist/combined-snake.svg", "w") as f:
              f.write(base_svg)
          '

      # 4. Push final combined SVG to output branch
      - name: Push Combined SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
