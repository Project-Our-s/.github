name: Generate Dual Snake Animation

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Swagatam's Snake (Cyan Snake + All-Blue Gradient Grid)
      - name: Generate Swagatam's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swagatambordoloi
          outputs: |
            dist/swagatam-snake.svg?color_snake=#38bdf8&color_dots=#161b22,#032852,#0a58ca,#0d6efd,#6ea8fe

      # Simpi's Snake (Pink Snake + Sakura Pink Grid)
      - name: Generate Simpi's Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: simpi11-insightflow
          outputs: |
            dist/simpi-snake.svg?color_snake=#f472b6&color_dots=#161b22,#4a1d24,#831843,#be185d,#f43f5e

      # Push both SVGs to output branch
      - name: Push SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
